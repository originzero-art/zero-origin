name: zero-origin Open-Core CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify-open-core:
    name: REUSE 3.0 SPDX & Cargo Workspace Suite
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Gate 1 - REUSE 3.0 SPDX & Dual-License DAG Audit
        run: python3 scripts/verify-reuse.py

      - name: Gate 2 - Workspace Unit & Integration Tests (--locked)
        run: cargo test --locked --workspace
