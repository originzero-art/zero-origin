[workspace]
resolver = "2"
members = [
    "crates/zero-origin-common",
    "crates/zero-origin-verify",
    "crates/zero-origin-scanner",
    "crates/zero-origin-ja4",
    "crates/zero-origin-c2pa",
    "crates/zero-origin-proxy",
    "crates/zero-origin-cli",
]

[workspace.package]
version = "0.1.0-mvp"
edition = "2021"
authors = ["Sebastian Paul Banszky <contact@originzero.art>"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "signal", "sync"] }
hyper = { version = "1.5", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "client-legacy", "http1", "http2"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "ring", "tls12", "webpki-roots"] }
http-body-util = "0.1"
bytes = "1.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pemfile = "2.2"
webpki-roots = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = { version = "2.1", features = ["rand_core", "pkcs8", "pem"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
sha2 = "0.10"
crc32fast = "1.4"
rcgen = "0.13"
zeroize = "1.8"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.5", features = ["derive"] }
ipnet = "2.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
